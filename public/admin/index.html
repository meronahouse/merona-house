<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merona House Admin</title>
  <style>
    :root {
      --pink: #f7a9b2;
      --pink-deep: #d8727f;
      --butter: #ffe7a3;
      --cream: #fff6ef;
      --ink: #4f3d35;
      --card: #ffffff;
      --line: #f2e3d7;
      --muted: #7b685c;
      --bad: #d85d62;
      --good: #2d7c57;
      --warn: #c4932d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 6px 0 rgba(79, 61, 53, 0.06);
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }
    .brand {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .btn {
      background: var(--pink);
      color: var(--ink);
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn.alt { background: var(--butter); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 18px;
    }
    .login-box {
      max-width: 420px;
      margin: 60px auto;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fffdfb;
      color: var(--ink);
    }
    .form-grid {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }
    label { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .chip {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      background: #f3ebd0;
      color: var(--ink);
    }
    .chip.bad { background: #f9dfe0; color: var(--bad); }
    .chip.good { background: #dff1e7; color: var(--good); }
    .chip.warn { background: #f9efce; color: var(--warn); }
    .menu-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .menu-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .muted { color: var(--muted); }
    .error { min-height: 24px; color: var(--bad); font-weight: 700; }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView" class="card login-box">
      <div class="brand">Merona House Admin</div>
      <div class="muted" style="margin-top: 8px;">Masukkan password admin</div>
      <div class="form-grid">
        <label>
          Password
          <input id="password" type="password" placeholder="ADMIN_TOKEN" />
        </label>
        <button class="btn" id="loginBtn">Masuk</button>
        <div id="loginError" class="error"></div>
      </div>
    </div>

    <div id="appView" style="display:none;">
      <div class="top">
        <div class="brand">Merona House</div>
        <button class="btn alt" id="logoutBtn">Keluar</button>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Pesanan</h2>
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Menu</th>
                <th>Total</th>
                <th>Pembayaran</th>
                <th>Pengiriman</th>
              </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </section>

        <section class="card">
          <h2>Menu</h2>
          <div id="menuList" class="menu-list"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const appView = document.getElementById('appView');
    const loginView = document.getElementById('loginView');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');
    const ordersTable = document.getElementById('ordersTable');
    const menuList = document.getElementById('menuList');

    function setAuth(token) {
      sessionStorage.setItem('merona_admin_token', token || '');
    }

    function getAuth() {
      return sessionStorage.getItem('merona_admin_token') || '';
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (!headers.Authorization) {
        headers.Authorization = 'Bearer ' + getAuth();
      }
      const res = await fetch(path, { ...options, headers });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(json.error || 'Request failed');
      }
      return json;
    }

    async function loadOrders() {
      try {
        const data = await api('/api/orders');
        const list = Array.isArray(data.orders) ? data.orders : [];
        ordersTable.innerHTML = list.map(order => `
          <tr>
            <td>${order.name || '-'}</td>
            <td>${order.item || '-'}<br><span class="muted">${order.qty || 1} pcs</span></td>
            <td>${Number(order.price || 0) * Number(order.qty || 1)}</td>
            <td>
              <button class="btn alt" data-kind="paid" data-id="${order.id}">${order.paid || 'Belum Lunas'}</button>
            </td>
            <td>
              <button class="btn alt" data-kind="ship" data-id="${order.id}">${order.ship || 'Diproses'}</button>
            </td>
          </tr>
        `).join('') || '<tr><td colspan="5" class="muted">Belum ada pesanan.</td></tr>';
      } catch (err) {
        ordersTable.innerHTML = '<tr><td colspan="5">Gagal memuat data order.</td></tr>';
      }
    }

    async function loadMenu() {
      try {
        const data = await api('/api/menu?full=1');
        const list = Array.isArray(data.menu) ? data.menu : [];
        menuList.innerHTML = list.map(item => `
          <div class="menu-item">
            <div>
              <strong>${item.n}</strong><br>
              <span class="muted">${item.t} · Rp ${Number(item.p || 0).toLocaleString('id-ID')}</span>
            </div>
            <button class="btn alt" data-menu-id="${item.id}">Edit</button>
          </div>
        `).join('') || '<div class="muted">Belum ada menu.</div>';
      } catch (err) {
        menuList.innerHTML = '<div class="muted">Gagal memuat menu.</div>';
      }
    }

    function renderApp() {
      const token = getAuth();
      if (!token) {
        loginView.style.display = 'block';
        appView.style.display = 'none';
        return;
      }

      loginView.style.display = 'none';
      appView.style.display = 'block';
      loadOrders();
      loadMenu();
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const value = passwordInput.value.trim();
      if (!value) {
        loginError.textContent = 'Password wajib diisi.';
        return;
      }

      try {
        const res = await fetch('/api/orders', {
          headers: { Authorization: 'Bearer ' + value }
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.error) {
          loginError.textContent = 'Password salah.';
          return;
        }

        setAuth(value);
        loginError.textContent = '';
        passwordInput.value = '';
        renderApp();
      } catch (err) {
        loginError.textContent = 'Login gagal.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      setAuth('');
      renderApp();
    });

    ordersTable.addEventListener('click', async function (e) {
      const btn = e.target.closest('[data-id]');
      if (!btn) return;

      try {
        const data = await api('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'toggle_status',
            kind: btn.dataset.kind,
            id: btn.dataset.id
          })
        });

        if (data.ok) {
          loadOrders();
        }
      } catch (err) {
        console.error(err);
      }
    });

    renderApp();
  </script>
</body>
</html>
