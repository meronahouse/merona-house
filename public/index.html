<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merona House</title>
  <style>
    :root {
      --pink: #f7a9b2;
      --pink-deep: #d8727f;
      --butter: #ffe7a3;
      --cream: #fff6ef;
      --ink: #4f3d35;
      --card: #ffffff;
      --line: #f2e3d7;
      --muted: #7b685c;
      --bg-grid: rgba(80, 60, 52, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      background-image:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    .topbar {
      background: var(--pink);
      color: var(--ink);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      padding: 12px 10px;
      font-size: 12px;
    }
    .hero {
      background: var(--card);
      border-radius: 26px;
      border: 1px solid var(--line);
      box-shadow: 0 6px 0 rgba(79, 61, 53, 0.08);
      padding: 20px;
      margin-top: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 2rem;
    }
    .brand .emoji { font-size: 2.3rem; }
    .sub { color: var(--muted); margin-top: 6px; }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-top: 22px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 5px 0 rgba(79, 61, 53, 0.06);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .menu-item {
      background: #fffaf6;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
    }
    .menu-item h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }
    .menu-item .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .price {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--pink);
      color: var(--ink);
      border: none;
      border-radius: 999px;
      font-weight: 800;
      padding: 10px 16px;
      cursor: pointer;
      min-width: 120px;
    }
    .btn.secondary {
      background: var(--butter);
    }
    .line { border-top: 1px dashed var(--line); margin: 16px 0; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
    }
    .cart-item strong { display: block; }
    .form-grid {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }
    .form-grid label { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fffdfb;
      color: var(--ink);
    }
    textarea { min-height: 100px; resize: vertical; }
    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 24px;
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">Catatan Merona</div>
  <div class="wrap">
    <section class="hero">
      <div class="brand"><span class="emoji">🍪</span><span>Merona House</span></div>
      <div class="sub">Pesan menu favoritmu, lalu admin akan memproses pesanan.</div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Menu</h2>
        <div id="menuList" class="menu-grid"></div>
      </section>

      <aside class="panel">
        <h2>Keranjang</h2>
        <div id="cartList"></div>
        <div class="line"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:800; margin-bottom:12px;">
          <span>Total</span>
          <span id="total">Rp 0</span>
        </div>

        <form id="orderForm">
          <div class="form-grid">
            <label>
              Nama
              <input name="name" required placeholder="Nama lengkap" />
            </label>
            <label>
              WhatsApp
              <input name="wa" required placeholder="08xxxxxxxxxx" />
            </label>
            <label>
              Alamat lengkap
              <textarea name="addr" required placeholder="Alamat pengiriman"></textarea>
            </label>
            <label>
              Catatan khusus
              <textarea name="note" placeholder="Opsional"></textarea>
            </label>
            <label>
              Mode pesanan
              <select name="mode">
                <option value="Sekarang">Sekarang</option>
                <option value="Booking">Booking</option>
              </select>
            </label>
            <label id="dueField" style="display:none;">
              Tanggal kirim / ambil
              <input name="due" type="date" />
            </label>
            <button type="submit" class="btn">Kirim Pesanan</button>
          </div>
        </form>

        <div id="status" class="status"></div>
      </aside>
    </div>
  </div>

  <script>
    const menuList = document.getElementById('menuList');
    const cartList = document.getElementById('cartList');
    const totalEl = document.getElementById('total');
    const statusEl = document.getElementById('status');
    const form = document.getElementById('orderForm');
    const dueField = document.getElementById('dueField');
    const cart = [];

    function formatRp(value) {
      return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
    }

    function renderCart() {
      if (!cart.length) {
        cartList.innerHTML = '<div class="sub">Keranjang masih kosong.</div>';
        totalEl.textContent = 'Rp 0';
        return;
      }

      let total = 0;
      cartList.innerHTML = cart.map((item, index) => {
        total += item.price * item.qty;
        return `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong>
              <span>${item.qty} x ${formatRp(item.price)}</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
              <button class="btn secondary" type="button" data-action="minus" data-index="${index}" style="min-width:40px; padding:8px 10px;">-</button>
              <button class="btn secondary" type="button" data-action="plus" data-index="${index}" style="min-width:40px; padding:8px 10px;">+</button>
            </div>
          </div>
        `;
      }).join('');

      totalEl.textContent = formatRp(total);
    }

    async function loadMenu() {
      try {
        const res = await fetch('/api/menu');
        const data = await res.json();
        if (!Array.isArray(data)) return;
        menuList.innerHTML = data.map(item => `
          <article class="menu-item">
            <h3>${item.n}</h3>
            <div class="meta">${item.t || 'Savory'}</div>
            <div class="price">
              <span>${formatRp(item.p)}</span>
              <button class="btn" type="button" data-id="${item.id}" data-name="${item.n}" data-price="${item.p}">Tambah</button>
            </div>
          </article>
        `).join('');
      } catch (e) {
        menuList.innerHTML = '<div class="status">Gagal memuat menu. Coba refresh halaman.</div>';
      }
    }

    menuList.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-id]');
      if (!btn) return;

      const match = cart.find(item => item.id === btn.dataset.id);
      if (match) {
        match.qty += 1;
      } else {
        cart.push({ id: btn.dataset.id, name: btn.dataset.name, price: Number(btn.dataset.price), qty: 1 });
      }
      renderCart();
    });

    cartList.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const index = Number(btn.dataset.index);
      const item = cart[index];
      if (!item) return;

      if (btn.dataset.action === 'plus') item.qty += 1;
      if (btn.dataset.action === 'minus') {
        item.qty -= 1;
        if (item.qty <= 0) cart.splice(index, 1);
      }

      renderCart();
    });

    form.mode.addEventListener('change', function () {
      const booking = this.value === 'Booking';
      dueField.style.display = booking ? 'grid' : 'none';
      if (!booking) form.due.value = '';
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!cart.length) {
        statusEl.textContent = 'Keranjang masih kosong.';
        return;
      }

      const formData = new FormData(form);
      const body = {
        action: 'order_public',
        order: {
          name: formData.get('name'),
          wa: formData.get('wa'),
          addr: formData.get('addr'),
          note: formData.get('note'),
          mode: formData.get('mode'),
          due: formData.get('due') || '',
          item: cart[0].name,
          qty: cart.reduce((sum, item) => sum + item.qty, 0),
          kind: 'Cookies'
        }
      };

      try {
        statusEl.textContent = 'Mengirim pesanan...';
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();

        if (!res.ok || json.error) {
          statusEl.textContent = json.error || 'Gagal mengirim pesanan.';
          return;
        }

        statusEl.textContent = 'Pesanan berhasil dikirim. Admin akan memprosesnya.';
        form.reset();
        cart.length = 0;
        renderCart();
      } catch (err) {
        statusEl.textContent = 'Terjadi kesalahan jaringan.';
      }
    });

    renderCart();
    loadMenu();
  </script>
</body>
</html>
